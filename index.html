<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Unikiq Notar – KompletLej</title>
<style>
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { background-color: #f4f7f5; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; color: #252525; }
  .app-card { background: #ffffff; width: 100%; max-width: 400px; border-radius: 20px; padding: 30px 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; border: 1px solid #e2e8e4; }
  .logo { font-size: 14px; font-weight: 700; color: #55b96b; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 5px; }
  h1 { font-size: 22px; margin: 0 0 20px 0; color: #2c3e50; }
  .field-group { text-align: left; margin-bottom: 25px; }
  label { font-size: 12px; font-weight: 600; color: #666; display: block; margin-bottom: 6px; text-transform: uppercase; }
  select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ccc; font-size: 15px; background: #fff; outline: none; }
  
  /* Optager Knap */
  .record-container { margin: 30px 0; }
  .mic-button { width: 100px; height: 100px; border-radius: 50%; background: #55b96b; border: none; color: white; font-size: 36px; cursor: pointer; box-shadow: 0 6px 15px rgba(85, 185, 107, 0.4); transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center; margin: 0 auto; outline: none; }
  .mic-button.recording { background: #e74c3c; box-shadow: 0 6px 15px rgba(231, 76, 60, 0.4); animation: pulse 1.5s infinite; }
  
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  
  .timer { font-size: 18px; font-weight: 700; margin-top: 15px; color: #555; font-mono: monospace; }
  .status-text { font-size: 13px; color: #888; margin-top: 5px; }
  
  .send-btn { width: 100%; padding: 14px; background: #2c3e50; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; display: none; margin-top: 15px; }
  .send-btn:disabled { background: #ccc; cursor: not-allowed; }
</style>
</head>
<body>

<div class="app-card">
  <div class="logo">Unikiq Notar DMA</div>
  <h1>Indtal Mødereferat</h1>

  <div class="field-group">
    <label for="maegler">Vælg Mægler</label>
    <select id="maegler">
      <option value="Christina">Christina</option>
      <option value="Martin">Martin</option>
      <option value="Carsten">Carsten</option>
      <option value="Joachim">Joachim</option>
    </select>
  </div>

  <div class="record-container">
    <button type="button" id="recordBtn" class="mic-button">🎙️</button>
    <div class="timer" id="timer">00:00</div>
    <div class="status-text" id="status">Tryk på mikrofonen for at optage</div>
  </div>

  <button type="button" id="sendBtn" class="send-btn">Send Referat til Backoffice 🚀</button>
</div>

<script>
  let mediaRecorder;
  let audioChunks = [];
  let isRecording = false;
  let timerInterval;
  let seconds = 0;
  let audioBlob = null;

  // Opdateret n8n Webhook Production URL
  const WEBHOOK_URL = 'https://n8n.unikiq.dk/webhook/TRIGGER-kompletlej-notar-dma';

  const recordBtn = document.getElementById('recordBtn');
  const sendBtn = document.getElementById('sendBtn');
  const timerDisplay = document.getElementById('timer');
  const statusDisplay = document.getElementById('status');

  recordBtn.addEventListener('click', async () => {
    if (!isRecording) {
      startRecording();
    } else {
      stopRecording();
    }
  });

  async function startRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = event => {
        audioChunks.push(event.data);
      };

      mediaRecorder.onstop = () => {
        audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        sendBtn.style.display = 'block';
        statusDisplay.innerText = 'Optagelse klar til afsendelse!';
      };

      mediaRecorder.start();
      isRecording = true;
      recordBtn.classList.add('recording');
      recordBtn.innerHTML = '⏹️';
      statusDisplay.innerText = 'Optager... Tryk for at stoppe';
      startTimer();
    } catch (err) {
      alert('Der skal gives adgang til mikrofonen for at bruge optageren.');
    }
  }

  function stopRecording() {
    mediaRecorder.stop();
    mediaRecorder.stream.getTracks().forEach(track => track.stop());
    isRecording = false;
    recordBtn.classList.remove('recording');
    recordBtn.innerHTML = '🎙️';
    stopTimer();
  }

  function startTimer() {
    seconds = 0;
    timerInterval = setInterval(() => {
      seconds++;
      const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
      const secs = String(seconds % 60).padStart(2, '0');
      timerDisplay.innerText = `${mins}:${secs}`;
    }, 1000);
  }

  function stopTimer() {
    clearInterval(timerInterval);
  }

  sendBtn.addEventListener('click', async () => {
    if (!audioBlob) return;

    sendBtn.disabled = true;
    sendBtn.innerText = 'Transkriberer & Sender...';

    const formData = new FormData();
    formData.append('file', audioBlob, 'optagelse.webm');
    formData.append('maegler', document.getElementById('maegler').value);

    try {
      const response = await fetch(WEBHOOK_URL, {
        method: 'POST',
        body: formData
      });

      if (response.ok) {
        alert('Mødereferat er afsendt til backoffice!');
        location.reload();
      } else {
        alert('Fejl ved afsendelse. Prøv igen.');
        sendBtn.disabled = false;
        sendBtn.innerText = 'Send Referat til Backoffice 🚀';
      }
    } catch (error) {
      alert('Netværksfejl ved afsendelse.');
      sendBtn.disabled = false;
      sendBtn.innerText = 'Send Referat til Backoffice 🚀';
    }
  });
</script>

</body>
</html>
